# .github/workflows/plugin-install-fixture.yml
# Validates the unifylabs-workflow plugin's structural integrity + smoke-tests
# scripts/init-project.sh against the v2 tier tree (core + claude-runtime +
# optional + compliance) using ephemeral targets in $RUNNER_TEMP.
#
# Replaces v1's bootstrap-fixture.yml. The runner does NOT have the `claude`
# CLI available, so this workflow validates structure + script behavior
# instead of running the actual /plugin install command. Hook-firing
# verification is user-gated post-install (see CHANGELOG [2.0.0]
# "Migration from v1.0.0" section).
#
name: plugin-install-fixture

on:
  pull_request:
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'scripts/init-project.sh'
      - 'scripts/audit-scan.sh'
      - 'scripts/dev-symlink-skills.sh'
      - 'templates/**'
      - 'scripts/test-fixtures/init-project/**'
      - '.github/workflows/plugin-install-fixture.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structural-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: marketplace.json + plugin.json are valid JSON
        run: |
          set -euxo pipefail
          jq -e . .claude-plugin/marketplace.json > /dev/null
          jq -e . plugins/unifylabs-workflow/.claude-plugin/plugin.json > /dev/null

      - name: marketplace.json lists unifylabs-workflow
        run: |
          set -euxo pipefail
          jq -e '.plugins[] | select(.name == "unifylabs-workflow")' \
            .claude-plugin/marketplace.json > /dev/null

      - name: plugin.json version is valid semver with required-skill description
        run: |
          set -euxo pipefail
          v=$(jq -r .version plugins/unifylabs-workflow/.claude-plugin/plugin.json)
          echo "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "expected semver x.y.z[-prerelease], got $v"; exit 1; }
          desc=$(jq -r .description plugins/unifylabs-workflow/.claude-plugin/plugin.json)
          for s in work-issue spec-it ship phasing extract-prototype-review integrate-branch analyze-comms promote-to-marketplace compliance-research iterative-review humanizer handoff; do
            echo "$desc" | grep -q "$s" || { echo "description missing skill: $s"; exit 1; }
          done
          if echo "$desc" | grep -q '\[stub\]'; then
            echo "description still contains [stub] marker"
            exit 1
          fi
          if echo "$desc" | grep -q 'review-prototype[^-]'; then
            echo "description still references retired 'review-prototype' (renamed to extract-prototype-review in 2.0.1)"
            exit 1
          fi

      - name: All skill SKILL.md files have name+description frontmatter
        run: |
          set -euxo pipefail
          for f in plugins/unifylabs-workflow/skills/*/SKILL.md; do
            head -10 "$f" | grep -qE '^name:' \
              || { echo "$f missing name: frontmatter"; exit 1; }
            head -10 "$f" | grep -qE '^description:' \
              || { echo "$f missing description: frontmatter"; exit 1; }
          done

      - name: 12 skills + 16 commands present
        run: |
          set -euxo pipefail
          n_skills=$(find plugins/unifylabs-workflow/skills -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          test "$n_skills" = "12" || { echo "expected 12 skills, found $n_skills"; exit 1; }
          n_cmds=$(find plugins/unifylabs-workflow/commands -maxdepth 1 -name '*.md' | wc -l | tr -d ' ')
          test "$n_cmds" = "16" || { echo "expected 16 commands, found $n_cmds"; exit 1; }

      - name: humanizer has no .git/ leak
        run: |
          set -euxo pipefail
          test ! -e plugins/unifylabs-workflow/skills/humanizer/.git

      - name: Hook scripts executable + shebang + hooks.json uses CLAUDE_PLUGIN_ROOT
        run: |
          set -euxo pipefail
          for f in plugins/unifylabs-workflow/hooks/*.sh; do
            test -x "$f" || { echo "$f not executable"; exit 1; }
            head -1 "$f" | grep -qE '^#!.*bash' \
              || { echo "$f bad shebang"; exit 1; }
          done
          # Every command in hooks.json must use ${CLAUDE_PLUGIN_ROOT}.
          jq -e '
            [.. | objects | select(has("command")) | .command]
            | all(. as $c | $c | startswith("${CLAUDE_PLUGIN_ROOT}"))
          ' plugins/unifylabs-workflow/hooks/hooks.json > /dev/null

      - name: Hook scripts parse cleanly (bash -n)
        run: |
          set -euo pipefail
          fail=0
          for f in plugins/unifylabs-workflow/hooks/*.sh plugins/unifylabs-workflow/statusline/statusline.sh; do
            if ! bash -n "$f"; then
              echo "::error file=$f::failed bash -n"
              fail=1
            fi
          done
          if [[ $fail -ne 0 ]]; then
            exit 1
          fi
          echo "all hook scripts parse cleanly"

      - name: hooks.json references existing files
        run: |
          set -euo pipefail
          fail=0
          # Extract every command path, substitute ${CLAUDE_PLUGIN_ROOT} with the
          # plugin directory, and assert the file exists.
          while IFS= read -r cmd; do
            [[ -z "$cmd" ]] && continue
            resolved="${cmd/\$\{CLAUDE_PLUGIN_ROOT\}/plugins/unifylabs-workflow}"
            if [[ ! -e "$resolved" ]]; then
              echo "::error::hooks.json references missing file: $cmd (resolved: $resolved)"
              fail=1
            fi
          done < <(jq -r '[.. | objects | select(has("command")) | .command] | .[]' plugins/unifylabs-workflow/hooks/hooks.json)
          if [[ $fail -ne 0 ]]; then
            exit 1
          fi
          echo "all hooks.json file references exist on disk"

      - name: Statusline present + executable
        run: |
          set -euxo pipefail
          test -x plugins/unifylabs-workflow/statusline/statusline.sh

  init-project-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq + bash
        run: sudo apt-get update && sudo apt-get install -y jq bash

      - name: init-project --help advertises v2 flags
        run: |
          set -euxo pipefail
          out=$(scripts/init-project.sh --help 2>&1)
          echo "$out" | grep -q -- '--compliance=' || { echo "missing --compliance"; exit 1; }
          echo "$out" | grep -q -- '--include='    || { echo "missing --include";    exit 1; }
          echo "$out" | grep -q -- '--snippets='   || { echo "missing --snippets";   exit 1; }

      - name: init-project clean install (core + claude-runtime only)
        run: |
          set -euxo pipefail
          TGT="$RUNNER_TEMP/init-bare"
          mkdir -p "$TGT"
          scripts/init-project.sh "$TGT" \
            --config scripts/test-fixtures/init-project/init-project-test-config.yml
          # Core tier files exist.
          for f in CLAUDE.md CHEATSHEET.md \
                   docs/ai-usage-charter.md docs/mcp-policy.md \
                   docs/security-checklist.md docs/specs/README.md \
                   .github/pull_request_template.md \
                   .github/ISSUE_TEMPLATE/feature_request.yml \
                   .github/ISSUE_TEMPLATE/bug_report.yml \
                   .github/CODEOWNERS \
                   .mcp.json .claude/settings.json; do
            test -f "$TGT/$f" || { echo "ERROR: missing $f"; exit 1; }
          done
          # Manifest schema.
          jq -e '.compliance_profiles | length == 0' "$TGT/.unify-kit-project-manifest.json" > /dev/null
          jq -e '.includes | length == 0'            "$TGT/.unify-kit-project-manifest.json" > /dev/null
          jq -e '.snippets | length == 0'            "$TGT/.unify-kit-project-manifest.json" > /dev/null
          # No unsubstituted placeholders.
          if grep -rohE '\{\{[A-Z][A-Z0-9_]*\}\}' "$TGT"; then
            echo "ERROR: unsubstituted placeholders remain"; exit 1
          fi

      - name: init-project compliance install (PHIPA + extends baseline)
        run: |
          set -euxo pipefail
          TGT="$RUNNER_TEMP/init-phipa"
          mkdir -p "$TGT"
          scripts/init-project.sh "$TGT" \
            --config scripts/test-fixtures/init-project/init-project-test-config.yml \
            --compliance=healthcare-phipa
          # PHIPA-specific
          test -f "$TGT/docs/compliance/phipa-readiness.md"
          # baseline carry-forward via extends
          test -f "$TGT/docs/compliance/pipeda-readiness.md"
          test -f "$TGT/runbooks/vendor-escape-template.md"
          test -f "$TGT/runbooks/access-revocation.md"
          # No cross-profile relative links remain
          if grep -r '\.\./\.\./baseline-pipeda' "$TGT" 2>/dev/null; then
            echo "ERROR: unrewritten relative links to baseline-pipeda"; exit 1
          fi
          # CLAUDE.md has both addenda markers
          n=$(grep -c 'compliance-addendum' "$TGT/CLAUDE.md")
          test "$n" = "2" || { echo "expected 2 addenda markers, got $n"; exit 1; }
          # Manifest lists both profiles in order
          jq -e '.compliance_profiles == ["baseline-pipeda", "healthcare-phipa"]' \
            "$TGT/.unify-kit-project-manifest.json" > /dev/null

      - name: init-project SOC2 + financial composition
        run: |
          set -euxo pipefail
          TGT="$RUNNER_TEMP/init-fc-soc2"
          mkdir -p "$TGT"
          scripts/init-project.sh "$TGT" \
            --config scripts/test-fixtures/init-project/init-project-test-config.yml \
            --compliance=financial-canada,general-soc2 --snippets=nextjs
          # All three (baseline auto-prepended, financial-canada, general-soc2).
          jq -e '.compliance_profiles == ["baseline-pipeda", "financial-canada", "general-soc2"]' \
            "$TGT/.unify-kit-project-manifest.json" > /dev/null
          test -f "$TGT/docs/compliance/fintrac-readiness.md"
          test -f "$TGT/docs/compliance/soc2-controls-mapping.md"
          test -f "$TGT/runbooks/vendor-management.md"

      - name: init-project --dry-run writes nothing
        run: |
          set -euxo pipefail
          TGT="$RUNNER_TEMP/init-dry"
          mkdir -p "$TGT"
          scripts/init-project.sh "$TGT" \
            --config scripts/test-fixtures/init-project/init-project-test-config.yml \
            --compliance=baseline-pipeda --dry-run
          if [ -n "$(find "$TGT" -type f 2>/dev/null)" ]; then
            echo "ERROR: --dry-run created files"; exit 1
          fi

      - name: init-project re-run idempotency
        run: |
          set -euxo pipefail
          TGT="$RUNNER_TEMP/init-phipa"
          out=$(scripts/init-project.sh "$TGT" \
            --config scripts/test-fixtures/init-project/init-project-test-config.yml \
            --compliance=healthcare-phipa 2>&1)
          echo "$out"
          # No preserved (user-edit detection) on a clean re-run.
          echo "$out" | grep -qE 'Preserved: 0' || { echo "ERROR: re-run flagged preserved files"; exit 1; }
          # No new backups (manual-edit re-runs would have created some).
          new_baks=$(find "$TGT" -name '*.bak.*' 2>/dev/null || true)
          if [ -n "$new_baks" ]; then echo "ERROR: re-run created backups: $new_baks"; exit 1; fi

      - name: init-project --force restores tampered target
        run: |
          set -euxo pipefail
          TGT="$RUNNER_TEMP/init-tamper"
          mkdir -p "$TGT"
          scripts/init-project.sh "$TGT" \
            --config scripts/test-fixtures/init-project/init-project-test-config.yml > /dev/null
          orig_sha=$(shasum -a 256 "$TGT/CLAUDE.md" | cut -d' ' -f1)
          echo '# tampered' > "$TGT/CLAUDE.md"
          scripts/init-project.sh "$TGT" \
            --config scripts/test-fixtures/init-project/init-project-test-config.yml \
            --force
          restored=$(shasum -a 256 "$TGT/CLAUDE.md" | cut -d' ' -f1)
          test "$restored" = "$orig_sha" \
            || { echo "ERROR: --force did not restore (got=$restored expected=$orig_sha)"; exit 1; }
          # Tampered version is backed up.
          tampered_bak=""
          for bak in "$TGT"/CLAUDE.md.bak.*; do
            [ -f "$bak" ] || continue
            if grep -q '^# tampered$' "$bak"; then
              tampered_bak="$bak"; break
            fi
          done
          test -n "$tampered_bak" || { echo "ERROR: tampered backup missing"; exit 1; }

      - name: audit-scan happy path (good-fixture)
        run: |
          set -euxo pipefail
          scripts/audit-scan.sh scripts/test-fixtures/settings.json.good-fixture

      - name: audit-scan bad-fixture surfaces critical findings
        run: |
          set -euxo pipefail
          if scripts/audit-scan.sh scripts/test-fixtures/settings.json.bad-fixture > out.txt 2>&1; then
            echo "ERROR: bad-fixture should exit non-zero"; cat out.txt; exit 1
          fi
          cat out.txt
          grep -q 'inline-credential'   out.txt || { echo "missing inline-credential";  exit 1; }
          grep -q 'unrestricted-mcp'    out.txt || { echo "missing unrestricted-mcp";   exit 1; }

      - name: audit-scan --check-plugin (plugin not installed → warning, exit 0)
        run: |
          set -euxo pipefail
          out=$(scripts/audit-scan.sh scripts/test-fixtures/settings.json.good-fixture --check-plugin 2>&1)
          echo "$out"
          echo "$out" | grep -q 'plugin-not-detected' \
            || { echo "expected plugin-not-detected warning"; exit 1; }

      - name: dev-symlink-skills.sh --dry-run smoke
        run: |
          set -euxo pipefail
          # Set CLAUDE_HOME to a tmp dir so we don't touch the runner's real ~/.claude.
          # Script uses $HOME directly; override via HOME env.
          HOME="$RUNNER_TEMP/fake-home" bash scripts/dev-symlink-skills.sh --dry-run

  # The enforced-loop substrate gate (M1). The kit otherwise runs zero Node
  # tooling; this is the first executed-JS gate, because an enforced
  # loop-until-dry's ceilings are only PROVABLE by running them (a prose rule a
  # model is asked to honor is not). Zero-dep on purpose: bare `node --test` /
  # `node --check`, no package.json / node_modules (ADR: Node stack expansion).
  # Triggered via the existing `plugins/**` path filter above.
  loop-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20 (zero-dep — node --test / node --check only)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: iterative-review workflow .mjs parse cleanly (node --check)
        run: |
          set -euxo pipefail
          dir=plugins/unifylabs-workflow/skills/iterative-review/workflow
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            node --check "$f"
          done < <(find "$dir" -name '*.mjs' -type f 2>/dev/null)

      - name: iterative-review enforced-loop tests (node --test, zero-dep)
        run: |
          set -euxo pipefail
          shopt -s nullglob
          testdir=plugins/unifylabs-workflow/skills/iterative-review/workflow/test
          tests=("$testdir"/*.test.mjs)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "::error::no enforced-loop tests found under $testdir — the gate must have tests"
            exit 1
          fi
          node --test "${tests[@]}"

      # PARITY GUARD: the committed iterative-review.workflow.mjs bundle is the
      # script the Workflow tool actually runs (the runtime VM cannot import, so
      # the tested kernel + glue are INLINED into it). Regenerate from source and
      # fail if the committed bundle drifted — a stale bundle would ship untested
      # code. The bundler is deterministic (fixed dep order, no timestamps/random),
      # so a fresh regeneration MUST reproduce the committed bytes exactly.
      - name: iterative-review bundle parity (regenerate + git diff + node --check)
        run: |
          set -euxo pipefail
          dir=plugins/unifylabs-workflow/skills/iterative-review/workflow
          bundle="$dir/iterative-review.workflow.mjs"
          # The bundle MUST be a tracked git file. If it were untracked or
          # gitignored, the `git diff --exit-code` parity guard below would
          # silently pass (git diff ignores untracked paths), disarming the
          # whole guard. Fail loudly if it is not under version control.
          git ls-files --error-unmatch "$bundle" \
            || { echo "::error file=$bundle::bundle is not a tracked git file — add it so the parity guard cannot be silently disarmed"; exit 1; }
          ( cd "$dir" && node build-workflow.mjs )
          # The committed bundle must match a fresh regeneration byte-for-byte.
          git diff --exit-code -- "$bundle" \
            || { echo "::error file=$bundle::bundle drift — run 'node build-workflow.mjs' and commit the result"; exit 1; }
          # The generated bundle must itself parse cleanly and carry NO imports
          # (the Workflow VM cannot resolve them). `grep -a` forces text mode so
          # a stray NUL byte can never silently suppress the match on any grep
          # flavor (the bundle is text by construction; -a defends against
          # regression).
          node --check "$bundle"
          if grep -anE '^[[:space:]]*import[[:space:]]' "$bundle"; then
            echo "::error file=$bundle::bundle contains an import statement — the Workflow VM cannot import"
            exit 1
          fi
          echo "bundle is tracked, in parity with source, and import-free"

  # The Stop-hook verifier-backstop gate (M1). The deterministic no-LLM half of
  # the verification spine: a Stop hook that re-runs the project's REAL verifier
  # fresh and BLOCKS the stop on a live RED. Its enforcement signal (block on a
  # non-zero verifier exit, fail-open everywhere else) is only PROVABLE by
  # running it with the real Stop-event envelope — a prose claim is not proof.
  # Needs BOTH Node (the resolver shim imports the canonical resolveVerifier) and
  # jq/git (payloads + the git tree-state fingerprint + fixture repos).
  # Triggered via the existing `plugins/**` path filter above.
  verifier-backstop-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20 (zero-dep — node --test / node --check only)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Resolver shim parses + tests pass (node --check / node --test)
        run: |
          set -euxo pipefail
          shim=plugins/unifylabs-workflow/bin/verifier-resolve.mjs
          node --check "$shim"
          node --test plugins/unifylabs-workflow/bin/verifier-resolve.test.mjs

      # DRIFT GUARD: the shim must IMPORT the one canonical resolveVerifier and
      # never re-declare it locally. A local reimplementation would let the
      # backstop's detection drift from the iterative-review resolver — fail if
      # the import line is absent OR a line-leading `function resolveVerifier`
      # definition appears.
      - name: Resolver-drift guard (shim imports the canonical resolver, no inline reimpl)
        run: |
          set -euxo pipefail
          shim=plugins/unifylabs-workflow/bin/verifier-resolve.mjs
          grep -qE 'import \{ resolveVerifier \}' "$shim" \
            || { echo "::error file=$shim::shim does not import { resolveVerifier } from the canonical lib — the one-resolver invariant is broken"; exit 1; }
          if grep -anE '^[[:space:]]*function[[:space:]]+resolveVerifier' "$shim"; then
            echo "::error file=$shim::shim contains an inline 'function resolveVerifier' definition — it must IMPORT the canonical resolver, not reimplement it"
            exit 1
          fi
          echo "shim imports the canonical resolveVerifier and carries no inline reimplementation"

      # Determinism guard: the hook's trigger + decision path must use NO
      # wall-clock (date +%s) / Date.now / Math.random outside comments. The
      # scope/state fingerprint is git-derived, not clock-derived. Strip comment
      # lines before scanning so the invariant-describing header cannot trip it.
      - name: Hook decision path is clock-free (no date +%s / Date.now / Math.random)
        run: |
          set -euxo pipefail
          hook=plugins/unifylabs-workflow/hooks/verifier-backstop.sh
          if grep -nE 'date \+%s|Date\.now|Math\.random' "$hook" | grep -vE '^[0-9]+:[[:space:]]*#'; then
            echo "::error file=$hook::a wall-clock/random call appears outside a comment — the decision path must be deterministic"
            exit 1
          fi
          echo "hook decision path is clock-free"

      - name: Harness is executable + parses cleanly (bash -n)
        run: |
          set -euxo pipefail
          h=plugins/unifylabs-workflow/hooks/test/test-verifier-backstop.sh
          test -x "$h" || { echo "::error file=$h::harness not executable"; exit 1; }
          bash -n "$h"

      # GATE: drive the real Stop hook with real envelopes; assert it blocks on a
      # live RED verifier, allows on GREEN, no-ops when not engaged / empty, and
      # honors the marker cost-gate. Any failed case => harness exits non-zero.
      - name: Backstop fires + blocks (test-verifier-backstop.sh, normal)
        run: |
          set -euxo pipefail
          plugins/unifylabs-workflow/hooks/test/test-verifier-backstop.sh

      # GATE-THE-GATE (RED, like the security-hook + P0 gates): point the harness
      # at an always-exit-0 stub. The block-asserting cases (RED engaged, override
      # failing) MUST then fail. If the harness PASSED against the always-allow
      # stub its block assertions are vacuous — fail the job.
      - name: RED self-test — always-allow stub MUST fail the block cases
        run: |
          set -euxo pipefail
          stub=plugins/unifylabs-workflow/hooks/test/stub-verifier-backstop-allow.sh
          if UNIFY_BACKSTOP_HOOK="$(pwd)/$stub" \
               plugins/unifylabs-workflow/hooks/test/test-verifier-backstop.sh; then
            echo "::error::RED self-test PASSED against the always-allow stub — the block assertions are not binding (gate-the-gate failure)"
            exit 1
          fi
          echo "RED self-test correctly failed — block assertions bind to real hook enforcement"

  # The planning-brain seed gate (M2 seed). The planning brain (Ground -> Plan
  # -> Critique -> Judge) is committed as a self-contained importer-free Workflow
  # bundle, exactly like the iterative-review loop: a tested .mjs kernel + an
  # injection wrapper + an agent-backed glue, INLINED by a deterministic bundler.
  # CI cannot test planning QUALITY (that needs a live model — the human/live
  # eval); this gate guards WIRING + salvage + determinism: the pure logic and
  # the injection wrapper pass `node --test`, and the committed bundle is in
  # parity with a fresh regeneration and carries ZERO import lines (the Workflow
  # VM cannot import). Zero-dep: bare `node --test` / `node --check` on pinned
  # Node 20. Triggered via the existing `plugins/**` path filter above.
  planning-brain-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20 (zero-dep — node --test / node --check only)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: planning-brain workflow .mjs parse cleanly (node --check)
        run: |
          set -euxo pipefail
          dir=plugins/unifylabs-workflow/workflows/planning-brain
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            node --check "$f"
          done < <(find "$dir" -name '*.mjs' -type f 2>/dev/null)

      - name: planning-brain wiring + salvage tests (node --test, zero-dep)
        run: |
          set -euxo pipefail
          shopt -s nullglob
          testdir=plugins/unifylabs-workflow/workflows/planning-brain/test
          tests=("$testdir"/*.test.mjs)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "::error::no planning-brain tests found under $testdir — the gate must have tests"
            exit 1
          fi
          node --test "${tests[@]}"

      # PARITY GUARD: the committed planning-brain.workflow.mjs bundle is the
      # script the Workflow tool actually runs (the runtime VM cannot import, so
      # the tested kernel + glue are INLINED into it). Regenerate from source and
      # fail if the committed bundle drifted — a stale bundle would ship untested
      # code. The bundler is deterministic (fixed dep order, no timestamps/random),
      # so a fresh regeneration MUST reproduce the committed bytes exactly.
      - name: planning-brain bundle parity (regenerate + git diff + node --check)
        run: |
          set -euxo pipefail
          dir=plugins/unifylabs-workflow/workflows/planning-brain
          bundle="$dir/planning-brain.workflow.mjs"
          # The bundle MUST be a tracked git file. If it were untracked or
          # gitignored, the `git diff --exit-code` parity guard below would
          # silently pass (git diff ignores untracked paths), disarming the
          # whole guard. Fail loudly if it is not under version control.
          git ls-files --error-unmatch "$bundle" \
            || { echo "::error file=$bundle::bundle is not a tracked git file — add it so the parity guard cannot be silently disarmed"; exit 1; }
          ( cd "$dir" && node build-workflow.mjs )
          # The committed bundle must match a fresh regeneration byte-for-byte.
          git diff --exit-code -- "$bundle" \
            || { echo "::error file=$bundle::bundle drift — run 'node build-workflow.mjs' and commit the result"; exit 1; }
          # The generated bundle must itself parse cleanly and carry NO imports
          # (the Workflow VM cannot resolve them). `grep -a` forces text mode so
          # a stray NUL byte can never silently suppress the match on any grep
          # flavor (the bundle is text by construction; -a defends against
          # regression).
          node --check "$bundle"
          if grep -anE '^[[:space:]]*import[[:space:]]' "$bundle"; then
            echo "::error file=$bundle::bundle contains an import statement — the Workflow VM cannot import"
            exit 1
          fi
          echo "bundle is tracked, in parity with source, and import-free"

  # The Tier-1 security-hook ENFORCEMENT gate (P4). The kit previously had NO
  # test that proves a security hook fires+blocks, and CI executed zero hooks —
  # a verbatim hook's enforcement signal is only PROVABLE by running it with the
  # real hook-event JSON envelope and asserting its real exit code (a prose claim
  # that "the hook blocks" is not proof). Zero-dep on purpose: bare bash + the
  # python3/git/jq already on ubuntu-latest. Drives the seven verbatim hooks
  # (never reimplementations). Triggered via the existing `plugins/**` path
  # filter above.
  security-hook-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships bash + python3 + git; jq is the only add (mirrors
      # the structural-validation job's install step). The harness preflight
      # fails LOUDLY if python3/git are missing (the hooks fail-CLOSED without
      # them, which would make ALLOW cases look like spurious blocks).
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Harness is executable + parses cleanly (bash -n)
        run: |
          set -euxo pipefail
          h=plugins/unifylabs-workflow/hooks/test/test-security-hooks.sh
          test -x "$h" || { echo "::error file=$h::harness not executable"; exit 1; }
          bash -n "$h"

      # GATE: drive all seven verbatim hooks with real envelopes; assert each
      # one's real enforcement signal (exit 2 block / exit 0 allow / advisory
      # fires+exit 0). Any failed case => harness exits non-zero => job fails.
      - name: Security hooks fire + block (test-security-hooks.sh, normal)
        run: |
          set -euxo pipefail
          plugins/unifylabs-workflow/hooks/test/test-security-hooks.sh

      # GATE-THE-GATE (RED, like the P0 executed-JS gate): with the expectations
      # inverted the harness MUST fail. If it passed here, the assertions are
      # not actually binding to real hook behavior (vacuous-pass regression) and
      # the normal run above could be giving false confidence — fail the job.
      - name: RED self-test — inverted expectations MUST fail
        run: |
          set -euxo pipefail
          if HARNESS_SELFTEST_RED=1 \
               plugins/unifylabs-workflow/hooks/test/test-security-hooks.sh; then
            echo "::error::RED self-test PASSED — assertions are not binding to real hook behavior (gate-the-gate failure)"
            exit 1
          fi
          echo "RED self-test correctly failed — assertions bind to real hook enforcement"

  # The P6 no-regression TRUST-GATE scorer — the TIER-1 OFFLINE half of the
  # M1->M2 gate (design §12, §14 #3). It scores iterative-review run transcripts
  # against the frozen code-mode benchmark and decides worst-of-N Critical-recall
  # vs the human-gated baseline. The scorer is a standalone zero-dep Node script
  # (NOT a bundled Workflow), so there is no bundle/parity step — just node
  # --check + node --test + the CLI gate contract. Tier-1 GREEN here does NOT
  # discharge the binding gate: that still needs N>=3 LIVE witnessed runs + Tomer
  # sign-off (which cannot run on a runner with no `claude`/credentials).
  no-regression-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20 (zero-dep — node --test / node --check only)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: no-regression eval .mjs parse cleanly (node --check)
        run: |
          set -euxo pipefail
          dir=plugins/unifylabs-workflow/skills/iterative-review/evals
          node --check "$dir/run-no-regression-eval.mjs"
          node --check "$dir/run-no-regression-eval.test.mjs"

      - name: scorer unit + matching + RED-normalization tests (node --test, zero-dep)
        run: |
          set -euxo pipefail
          dir=plugins/unifylabs-workflow/skills/iterative-review/evals
          node --test "$dir/run-no-regression-eval.test.mjs"

      # TIER-1 GREEN: run the scorer in self-test mode. It re-scores the three
      # committed baseline transcripts from scratch and asserts it reproduces
      # benchmark/baseline.json (worst-of-3 Critical-recall = 2/3, FP = 0). This
      # is the deterministic proof that the load-bearing line-coordinate
      # normalization is correct end-to-end (a naive raw compare floors recall at
      # 0). Exit 0 = the scorer agrees with the hand-reconciled P0 baseline.
      - name: Tier-1 self-test — scorer reproduces baseline.json
        run: |
          set -euxo pipefail
          dir=plugins/unifylabs-workflow/skills/iterative-review/evals
          node "$dir/run-no-regression-eval.mjs"

      # POSITIVE CONTROL: drive the live-runs CLI path (args supplied) with the
      # three committed baseline transcripts. They meet the baseline by
      # construction, so the gate MUST pass (exit 0). Exercises collectRunFiles +
      # per-file dispatch, not just the no-arg self-test path.
      - name: Positive control — baseline transcripts pass the gate
        run: |
          set -euxo pipefail
          dir=plugins/unifylabs-workflow/skills/iterative-review/evals
          node "$dir/run-no-regression-eval.mjs" "$dir/benchmark/baseline-transcripts"

      # RED GATE-THE-GATE: a deliberately bad run (a "false-clean" review that
      # surfaces ZERO Criticals while the benchmark plants three) MUST be rejected
      # with a non-zero exit. If the gate passed it here, its FAIL path is not
      # binding and a regressed engine could slip through — fail the job.
      - name: RED self-test — a false-clean run MUST be rejected
        run: |
          set -euxo pipefail
          dir=plugins/unifylabs-workflow/skills/iterative-review/evals
          bad="$RUNNER_TEMP/bad-run.md"
          cat > "$bad" <<'EOF'
          # Bad Review — false clean (no Criticals)

          | # | File | Line (cited) | Severity | Summary |
          |---|------|--------------|----------|---------|
          | 1 | src/checkout.js | 98 | Important | missing await — but reported NO Criticals |
          EOF
          if node "$dir/run-no-regression-eval.mjs" "$bad"; then
            echo "::error::RED self-test PASSED — the gate accepted a false-clean run (FAIL path not binding)"
            exit 1
          fi
          echo "RED self-test correctly failed — the gate rejects a regressed / false-clean run"
