# .github/workflows/scrub-check.yml
# Forbidden-strings scan against shipped artifacts only; placeholder-vocabulary
# scan on templates/. Specs, audit docs, ADRs, and test fixtures are exempt
# (they describe what's forbidden — they must be able to name the patterns).
#
name: scrub-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  forbidden-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan shipped artifacts for forbidden strings
        run: |
          set -euo pipefail
          # In-scope paths (shipped artifacts; must be clean). v2: hooks/ at
          # repo root removed; security hooks live under plugins/.
          SCOPE=(
            templates
            plugins
            github-actions
            README.md
            CHANGELOG.md
            CONTRIBUTING.md
            docs/philosophy.md
            docs/methodology.md
          )
          # llms.txt only exists post-P8; include if present.
          if [ -f llms.txt ]; then SCOPE+=(llms.txt); fi

          # Forbidden patterns (spec 09 §2). 10 patterns.
          PATTERNS=(
            'optics-management'
            'optics_boutique'
            'mvo_'
            'Mint Vision'
            'mintvisionsoptique'
            'Mvo[$]Staff'
            'aws-1-ca-central-1\.pooler\.supabase\.com'
            'postgres\.[a-z]+:'
            'sk-ant-'
            'AKIA[0-9A-Z]{16}'
          )

          FAIL=0
          for pat in "${PATTERNS[@]}"; do
            # In-scope dirs/files (skip missing entries silently).
            if grep -rE "$pat" "${SCOPE[@]}" 2>/dev/null; then
              echo "ERROR: forbidden pattern '$pat' found in shipped artifacts"
              FAIL=1
            fi
            # scripts/ excluding scripts/test-fixtures/ (fixtures intentionally contain bad patterns).
            if find scripts -type f -not -path 'scripts/test-fixtures/*' -exec grep -E "$pat" {} + 2>/dev/null; then
              echo "ERROR: forbidden pattern '$pat' found in scripts/ (non-fixture)"
              FAIL=1
            fi
          done

          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "OK: no forbidden strings in shipped artifacts"

  placeholder-vocab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify {{...}} placeholders are in supported vocabulary
        run: |
          set -euo pipefail
          # Supported vocabulary (20 placeholders per specs/02-templates.md +
          # templates/README.md). v2 added {{REPO_OWNER}} (CODEOWNERS) and
          # {{COMPLIANCE_PROFILE}} (compliance addendum + worked example).
          SUPPORTED=$(printf '%s\n' \
            '{{BUILD_CMD}}' '{{COMPLIANCE_PROFILE}}' '{{DATA_MODEL_PATH}}' '{{DB}}' \
            '{{FRAMEWORK}}' '{{KEY_LIBS}}' '{{LANG}}' '{{LANG_VERSION}}' \
            '{{LINT_CMD}}' '{{ONE_LINE_DESCRIPTION}}' '{{PROJECT_NAME}}' \
            '{{REPO_OWNER}}' '{{REPO_URL}}' '{{ROOT}}' '{{STACK}}' '{{TEAM_NAME}}' \
            '{{TEST_CI_CMD}}' '{{TEST_E2E_DIR}}' '{{TEST_FULL_CMD}}' '{{TYPECHECK_CMD}}' \
            | sort)
          # Regex permits uppercase letters, digits, and underscores
          # (e.g. {{TEST_E2E_DIR}} contains a digit). Identifiers must still
          # start uppercase per spec 02 §"Common conventions".
          USED=$(grep -ohrE '\{\{[A-Z][A-Z0-9_]*\}\}' templates/ | sort -u)

          # Every USED placeholder must be in SUPPORTED.
          EXTRA=$(comm -23 <(echo "$USED") <(echo "$SUPPORTED") || true)
          if [ -n "$EXTRA" ]; then
            echo "ERROR: undeclared placeholders used in templates/:"
            echo "$EXTRA"
            exit 1
          fi
          # Every SUPPORTED placeholder must appear in at least one template.
          MISSING=$(comm -23 <(echo "$SUPPORTED") <(echo "$USED") || true)
          if [ -n "$MISSING" ]; then
            echo "ERROR: declared placeholders never used in templates/:"
            echo "$MISSING"
            exit 1
          fi
          echo "OK: placeholder vocabulary is consistent"

  iterative-review-prose-cap-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard iterative-review prose against re-introduced stopping-rule caps
        run: |
          set -euo pipefail
          # The five stopping rules are ENFORCED IN CODE (M1):
          #   plugins/.../iterative-review/workflow/stopping-engine.mjs (+ lib/).
          # This guard keeps the prose from silently becoming an authoritative
          # rival source of the caps again. It is intentionally PRECISE — it
          # matches the OLD authoritative pseudocode patterns, not bare numbers
          # (grepping for "5" would false-positive on prose like "ceiling of 5").
          DOC='plugins/unifylabs-workflow/skills/iterative-review/references/stopping-rules.md'
          SKILL='plugins/unifylabs-workflow/skills/iterative-review/SKILL.md'
          ENGINE='stopping-engine.mjs'

          if [ ! -f "$DOC" ]; then
            echo "ERROR: expected $DOC to exist"
            exit 1
          fi
          if [ ! -f "$SKILL" ]; then
            echo "ERROR: expected $SKILL to exist"
            exit 1
          fi

          FAIL=0

          # (a) The doc MUST point at the enforced engine.
          if ! grep -qF "$ENGINE" "$DOC"; then
            echo "ERROR: $DOC must point at $ENGINE (single source of truth for the stopping rules)"
            FAIL=1
          fi

          # (b) The doc must NOT re-introduce authoritative pseudocode/caps. Each
          # pattern is a fixed string from the old python/JS rule blocks; none of
          # them legitimately appear in human-orientation prose. The skip-if-clean
          # / severity-gated / set-based-fixed-point blocks added 'issubset(' and
          # 'critical_findings_this_iter' to the surface area to catch.
          FORBIDDEN=(
            'if iteration_n'
            'if len(critical_n'
            'cumulative_tokens >'
            'MAX_ITERATIONS'
            'description[:80]'
            'issubset('
            'critical_findings_this_iter'
          )
          for pat in "${FORBIDDEN[@]}"; do
            if grep -qF -- "$pat" "$DOC"; then
              echo "ERROR: $DOC re-introduced authoritative stopping-rule pseudocode: '$pat'"
              echo "       The rules are enforced in $ENGINE — keep this file pointer-only."
              FAIL=1
            fi
          done

          # (c) SKILL.md must NOT carry an authoritative-cap RULE phrasing. The cap
          # is clamped in code; prose may POINT at the engine ("see
          # stopping-engine.mjs") but must not state the numeric rule itself. This
          # regex matches the rule phrasing ("exceed 3 iterations", "3-iteration
          # cap") without false-positiving on a pointer to the engine.
          if grep -nE 'exceed [0-9]+ iteration|[0-9]+-iteration cap' "$SKILL"; then
            echo "ERROR: $SKILL states an authoritative iteration cap in prose."
            echo "       The cap is clamped in $ENGINE — point at the engine, do not restate the rule."
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "OK: iterative-review stopping-rules.md is a pointer stub and SKILL.md carries no authoritative caps"
